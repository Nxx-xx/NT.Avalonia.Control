name: pdfviewer-native

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Ubuntu X11 and ELF inspection prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb xauth binutils python3 libicu74 fonts-dejavu-core fonts-noto-cjk
          libx11-6 libice6 libsm6 libfontconfig1 libfreetype6 libxcb1
          libxrandr2 libxi6 libxcursor1 libxrender1 libxext6 libgl1 libegl1 libdbus-1-3
      - name: Windows locked build, native backend/window and Core/Headless
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-PdfViewerNative.ps1 -OutputDirectory artifacts/pdfviewer-native/windows
      - name: Ubuntu locked build, actual PDFium and X11 window under Xvfb
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a --server-args="-screen 0 1600x1000x24 -dpi 96"
          bash ./scripts/Verify-PdfViewer-Linux.sh --output artifacts/pdfviewer-native/ubuntu-24.04
      - name: Pack and verify fresh-cache function/theme package consumers
        shell: pwsh
        run: |
          dotnet restore src/NT.AvaloniaControl.PdfViewer.Themes/NT.AvaloniaControl.PdfViewer.Themes.csproj --locked-mode --disable-parallel -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { throw 'Themes locked restore failed.' }
          ./scripts/Test-PdfViewerPackageConsumer.ps1
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfviewer-native-${{ matrix.os }}
          path: |
            artifacts/pdfviewer-native/**/run.json
            artifacts/pdfviewer-native/**/result.json
            artifacts/pdfviewer-native/**/environment.json
            artifacts/pdfviewer-native/**/source-before.json
            artifacts/pdfviewer-native/**/source-after.json
            artifacts/pdfviewer-native/**/native-asset.json
            artifacts/pdfviewer-native/**/source.json
            artifacts/pdfviewer-native/**/*.log
            artifacts/pdfviewer-native/**/*.xml
            artifacts/pdfviewer-native/**/*.png
            artifacts/pdfviewer-package-consumer-results.json
            artifacts/consumer/**/result.json
            artifacts/consumer/**/consumer-result.json
            artifacts/consumer/**/supervisor.json
            artifacts/consumer/**/stdout.log
            artifacts/consumer/**/stderr.log
            artifacts/consumer/**/Consumer.csproj
            artifacts/consumer/**/obj/project.assets.json
          if-no-files-found: warn
